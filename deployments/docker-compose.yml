version: '3.8'

services:
  # 1. 核心关系型数据库
  mysql:
    image: mysql:8.0
    container_name: goai-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: goai_interviewer
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. 高性能缓存与对话记忆持久化
  redis:
    image: redis:7.0-alpine
    container_name: goai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. MinIO 对象存储 (存放 PDF/Word 简历、生成的报告)
  minio:
    image: minio/minio:latest
    container_name: goai-minio
    ports:
      - "9000:9000" # API 端口
      - "9001:9001" # Web 控制台端口
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 4. Elasticsearch 8.x (混合检索与向量数据库)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: goai-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # 本地开发关闭安全认证，方便 Go 客户端直连
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # 限制内存使用，防止电脑卡顿
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # 5. Kafka (异步削峰，KRaft 模式免 Zookeeper)
  kafka:
    image: bitnami/kafka:3.6
    container_name: goai-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

# 声明本地数据卷，防止重启容器后数据丢失
volumes:
  mysql_data:
  redis_data:
  minio_data:
  es_data:
  kafka_data: