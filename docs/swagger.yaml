basePath: /api
definitions:
  dto.ChatRequest:
    properties:
      message:
        example: 什么是 GMP 模型？
        type: string
    required:
    - message
    type: object
  dto.LoginRequest:
    properties:
      userAccount:
        example: admin
        type: string
      userPassword:
        example: "123456"
        type: string
    required:
    - userAccount
    - userPassword
    type: object
  dto.LoginResponse:
    properties:
      id:
        example: 1
        type: integer
      userAccount:
        example: admin
        type: string
      userName:
        example: 管理员
        type: string
      userRole:
        example: admin
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      userAccount:
        example: testuser
        minLength: 4
        type: string
      userPassword:
        example: "123456"
        minLength: 6
        type: string
    required:
    - userAccount
    - userPassword
    type: object
  dto.ReportRequest:
    properties:
      jd:
        example: 需要3年Go开发经验，熟悉GMP模型...
        type: string
      resume:
        example: 熟练掌握Go语言，具有高并发经验...
        type: string
      session_id:
        example: user_123_session
        type: string
    required:
    - jd
    - resume
    - session_id
    type: object
  dto.StreamChatRequest:
    properties:
      message:
        example: 请解释一下 Go 的垃圾回收机制。
        type: string
      session_id:
        example: user_123_session
        type: string
    required:
    - message
    - session_id
    type: object
  dto.ThreatHunterRequest:
    properties:
      message:
        example: 帮我查一下这名候选人的背景信息
        type: string
      session_id:
        example: threat_hunter_123_session
        type: string
    required:
    - message
    - session_id
    type: object
  pkg.Response:
    properties:
      code:
        type: integer
      data:
        description: 这个字段名或 JSON tag 必须叫 data
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Phantomor
    url: https://github.com/Phantomor
  description: 基于 Go + MCP 协议的企业级零信任安全智能体平台 (AI SecOps)
  termsOfService: http://swagger.io/terms/
  title: ZeroTrust Sentinel API
  version: "1.0"
paths:
  /api/user/logout:
    post:
      consumes:
      - application/json
      description: 清除客户端的 login_token Cookie
      produces:
      - application/json
      responses:
        "200":
          description: '{"code": 0, "data": "退出成功"}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 用户退出登录
      tags:
      - 用户模块 (User)
  /chat:
    post:
      consumes:
      - application/json
      description: 处理基础的聊天请求，返回完整的字符串响应。
      parameters:
      - description: 对话内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{"code": 200, "data": "AI回答的内容..."}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{"error": "无效的请求参数"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"error": "大脑宕机了: ..."}'
          schema:
            additionalProperties: true
            type: object
      summary: 基础对话 (非流式)
      tags:
      - AI 对话模块 (AI Chat)
  /chat/stream:
    post:
      consumes:
      - application/json
      description: 带有 RAG 知识库检索、上下文记忆、MySQL持久化的流式对话接口。使用 Server-Sent Events (SSE)
        协议返回数据。
      parameters:
      - description: 包含 SessionID 的对话内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.StreamChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'data: {"content": "..."}\n\ndata: [DONE]\n\n'
          schema:
            type: string
        "400":
          description: '{"error": "无效的请求参数"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"error": "流式连接失败..."}'
          schema:
            additionalProperties: true
            type: object
      summary: 对话 (SSE 流式)
      tags:
      - AI 对话模块 (AI Chat)
  /interview/report:
    post:
      consumes:
      - application/json
      description: 根据候选人历史面试记录、简历和 JD，调用大模型生成结构化的面试评估 JSON 报告。
      parameters:
      - description: 报告生成请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ReportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{"code": 0, "data": {"score": 85, "strengths": [...], "hire_conclusion":
            "Hire"}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{"code": 400, "message": "参数错误或没有找到面试记录"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"code": 500, "message": "生成报告失败"}'
          schema:
            additionalProperties: true
            type: object
      summary: 生成面试报告
      tags:
      - AI 对话模块 (AI Chat)
  /secops/compliance:
    post:
      consumes:
      - application/json
      description: AI 合规顾问专用接口，基于企业零信任规范提供安全编码审查、漏洞修复建议与告警初步研判。具备独立的历史会话隔离 (Redis)。使用
        Server-Sent Events (SSE) 协议实时返回审查分析结果。
      parameters:
      - description: 包含 SessionID 的待审计代码片段、架构描述或告警日志
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.StreamChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'data: {\"content\": \"...\"}\n\ndata: [DONE]\n\n'
          schema:
            type: string
        "400":
          description: '{\"error\": \"无效的安全审计请求参数\"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{\"error\": \"流式安全连接建立失败...\"}'
          schema:
            additionalProperties: true
            type: object
      summary: DevSecOps 合规审查对话 (SSE 流式)
      tags:
      - ZeroTrust AI 引擎
  /secops/threat_hunter:
    post:
      consumes:
      - application/json
      description: 基于 MCP 协议和 ReAct 引擎，提供自动化安全研判与本地沙箱执行能力
      parameters:
      - description: 智能体对话请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ThreatHunterRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'data: {"content": "..."}\n\ndata: [DONE]\n\n'
          schema:
            type: string
        "400":
          description: '{"error": "参数错误"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"error": "不支持流式或推理中断"}'
          schema:
            additionalProperties: true
            type: object
      summary: ThreatHunter 核心调度接口
      tags:
      - ZeroTrust AI 引擎
  /upload/resume:
    post:
      consumes:
      - multipart/form-data
      description: 上传简历文件(PDF/Word等)至 MinIO，并异步投递文档解析任务到 Kafka 中转。
      parameters:
      - description: 需要上传的简历文件
        in: formData
        name: resume
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: '{"code": 0, "data": {"message": "简历上传成功...", "object_name":
            "resumes/..."}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{"code": 400, "message": "请上传简历文件"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"code": 500, "message": "文件存储失败或任务投递失败"}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 异步处理简历上传
      tags:
      - 简历模块 (Resume)
  /user/get/login:
    get:
      consumes:
      - application/json
      description: 从上下文中获取当前登录用户的 ID 和账号信息（需要登录凭证）
      produces:
      - application/json
      responses:
        "200":
          description: '{"code": 0, "data": {"id": 1, "userAccount": "xxx"}}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取当前登录用户信息
      tags:
      - 用户模块 (User)
  /user/login:
    post:
      consumes:
      - application/json
      description: 通过账号密码登录并返回 JWT Token
      parameters:
      - description: 登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "401":
          description: 账号或密码错误
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 用户登录接口
      tags:
      - 用户管理
  /user/register:
    post:
      consumes:
      - application/json
      description: 注册新用户，账号至少4位，密码至少6位。密码将在入库前通过 Bcrypt 加密。
      parameters:
      - description: 用户注册参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{"code": 0, "data": "注册成功"}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{"code": 400, "message": "账号已存在或参数校验失败"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"code": 500, "message": "服务端异常(如加密失败或数据库写入失败)"}'
          schema:
            additionalProperties: true
            type: object
      summary: 用户注册
      tags:
      - 用户模块 (User)
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
